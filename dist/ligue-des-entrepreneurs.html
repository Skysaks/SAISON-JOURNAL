is month","dormant","Follow up","Dormant","Prospects","Clients","Investors","Mentors","<div class=\"chips\" style=\"margin-bottom:12px\"><span class=\"muted small\">Tags:</span>{0}</div>","No contacts in this filter.","No contacts. Start with 10 key people: clients, prospects, investors, mentors. Example: “Purchasing director, industrial SME, met at the September trade show.”","<button type=\"button\" class=\"btn btn-sm\" data-a=\"quick\" data-kind=\"contact\">Add a contact</button>","\n  <div class=\"viewhead\"><div class=\"grow\"><div class=\"eyebrow\">Business happens through your network</div><h1>Network</h1></div><button type=\"button\" class=\"btn btn-primary\" data-a=\"quick\" data-kind=\"contact\">New contact</button></div>\n  <div class=\"kpis top\">{0}{1}{2}{3}</div>\n  <div class=\"view-top\">{4}</div>\n  <section class=\"card\">\n    <div class=\"chips\" style=\"margin-bottom:10px\">{5}{6}{7}{8}{9}{10}{11}{12}</div>\n    {13}\n    {14}\n  </section>","<span class=\"cstatus late\">Follow up</span>","<span class=\"cstatus ok\">Next follow-up {0}</span>","last contact {0} d ago","never contacted"," · <span class=\"muted\">open quest</span>","<p class=\"small\" style=\"margin-top:4px\"><b>Next action:</b> {0}{1}</p>","<button type=\"button\" class=\"btn btn-xs\" data-a=\"netNote\" data-id=\"{0}\">Contact made · +{1}</button>","<button type=\"button\" class=\"btn btn-xs btn-ghost\" data-a=\"netToQuest\" data-id=\"{0}\">Create a Market quest</button>","Details","<form class=\"form-row\" data-f=\"netLog\" data-id=\"{0}\" style=\"margin-top:8px\"><div class=\"grow\"><label class=\"lbl\" for=\"cn-{1}\">What was said</label><input type=\"text\" id=\"cn-{2}\" class=\"draft\" name=\"note\" maxlength=\"240\" placeholder=\"One line is enough\"></div><button type=\"submit\" class=\"btn btn-sm btn-primary\">Save</button><button type=\"button\" class=\"btn btn-sm btn-ghost\" data-a=\"netNoteCancel\">Cancel</button></form>","<option value=\"{0}\"{1}>{2} days</option>","<p class=\"small muted\">No contact logged yet.</p>","<div class=\"stack\" style=\"margin-top:10px\">\n      <div class=\"form-row\">\n        <div class=\"grow\"><label class=\"lbl\" for=\"cx-n-{0}\">Next action</label><input type=\"text\" id=\"cx-n-{1}\" data-c=\"netField\" data-field=\"next\" data-id=\"{2}\" maxlength=\"200\" value=\"{3}\"></div>\n        <div class=\"fix\"><label class=\"lbl\" for=\"cx-c-{4}\">Follow up every</label><select id=\"cx-c-{5}\" data-c=\"netField\" data-field=\"cadence\" data-id=\"{6}\">{7}</select></div>\n      </div>\n      <div class=\"form-row\">\n        <div class=\"fix\"><label class=\"lbl\" for=\"cx-r-{8}\">Role</label><select id=\"cx-r-{9}\" data-c=\"netField\" data-field=\"role\" data-id=\"{10}\">{11}</select></div>\n        <div class=\"grow\"><label class=\"lbl\" for=\"cx-o-{12}\">Company or organisation</label><input type=\"text\" id=\"cx-o-{13}\" data-c=\"netField\" data-field=\"org\" data-id=\"{14}\" maxlength=\"80\" value=\"{15}\"></div>\n        <div class=\"grow\"><label class=\"lbl\" for=\"cx-t-{16}\">Tags (comma-separated)</label><input type=\"text\" id=\"cx-t-{17}\" data-c=\"netField\" data-field=\"tags\" data-id=\"{18}\" maxlength=\"120\" value=\"{19}\"></div>\n      </div>\n      <div><label class=\"lbl\" for=\"cx-x-{20}\">Short notes</label><textarea id=\"cx-x-{21}\" data-c=\"netField\" data-field=\"notes\" data-id=\"{22}\" maxlength=\"500\" rows=\"2\">{23}</textarea></div>\n      {24}\n    </div>","<li class=\"crow\" id=\"contact-{0}\">\n    <div class=\"qline\"><div class=\"grow1\"><div class=\"title\">{1}</div>\n      <div class=\"meta\"><span class=\"chip\">{2}</span>{3}{4}<span class=\"due\">{5} · every {6} d</span>{7}</div>\n      {8}</div>\n      <div class=\"acts\">{9}{10}<button type=\"button\" class=\"btn btn-xs btn-ghost\" data-a=\"netOpen\" data-id=\"{11}\">{12}</button>{13}</div></div>\n    {14}\n    {15}\n  </li>","The basics","<p>Every day is a session scored out of 100. You choose 3 levers (concrete quests), do your routine, then close the session in the evening.</p>\n      <ul class=\"rules\"><li>{0} or more: win. {1} to {2}: draw. Below that: loss.</li><li>A day with no entry at all is lost by forfeit.</li><li>The season runs for several months; your career, though, never ends.</li></ul>","A typical day","<ol class=\"rules\"><li><b>Morning:</b> choose your 3 levers of the day on the Session screen, then open the session to lock in your plan.</li><li><b>During the day:</b> act on your levers, tick off your routine, start a focus block when you need to concentrate.</li><li><b>Evening:</b> close out. What was shipped, the main blocker, tomorrow's adjustment. Under two minutes.</li><li><b>The next day:</b> yesterday's session is locked automatically, with the rules in force that day.</li></ol>","Score, points, XP and level","<ul class=\"rules\"><li><b>Score (out of 100):</b> the day's execution. Levers {0} points, routine {1}, close-out {2}.</li><li><b>Points:</b> consistency. Win 3, draw 1, loss and forfeit 0. They make up your form and your division.</li><li><b>XP:</b> what you've accomplished (quests, habits, goals, reviews, knowledge, network, focus). It's never lost.</li><li><b>Level:</b> calculated from career XP. Each tier carries a title, from Aspiring founder to Entrepreneurship legend.</li></ul>","Day types","<ul class=\"rules\"><li><b>Normal</b> or <b>high intensity:</b> 3 levers required.</li><li><b>Recovery</b> or <b>travel:</b> 1 lever required.</li><li><b>Disruption:</b> 1 lever, to be reported with a reason, even after the fact.</li><li><b>Day off:</b> planned rest. The session doesn't count and the streak continues. The number of days off per week is set in the season.</li></ul>","The portfolio","<p>Three projects in play at most: one flagship project (XP × {0}) and two active projects (× {1}). Projects on watch (× {2}) wait their turn; those on ice (× {3}) are paused.</p>\n      <ul class=\"rules\"><li>Every change is a reallocation: by default, it takes effect at the next session.</li><li>A project in play with no Market or Ship action for 7 days is flagged as stagnant.</li><li>Life areas (body, mind, money, relationships) always stay at × 1.</li></ul>","Quests","<p>A quest is binary: done or not. Its type tells you its nature, its priority its importance.</p>\n      <ul class=\"rules\"><li><b>Ship</b> ({0} XP): what moves from your head out into the world.</li><li><b>Market</b> ({1} XP): a real contact with a client, a prospect, an investor.</li><li><b>Groundwork</b> ({2} XP): preparing, researching, organising.</li><li>Postponed {3} times, a quest is flagged as stuck: break it down or redefine it.</li><li>Anti-farming: at most {4} quests a day earn XP, including {5} unplanned.</li></ul>","Goals","<p>Vision (across several seasons) › 90-day target › season goals › month › week › quests.</p>\n      <ul class=\"rules\"><li>At most {0} goals per season, {1} per month and {2} per week. Beyond that, you're spreading yourself thin.</li><li>An unmet goal can be carried over to the next period.</li><li>Link your quests to a goal to see what's actually moving forward.</li></ul>","Reviews and board report","<ul class=\"rules\"><li>Weekly review (+{0} XP), monthly (+{1} XP) and season (+{2} XP). The weekly review asks for market proof and the amount collected.</li><li>The board report calculates the figures for the period.</li><li>Claude's interpretation relies only on these figures and on the context you write in Settings › Advanced.</li></ul>","Divisions, trophies and rewards","<ul class=\"rules\"><li><b>Division:</b> from Pre-seed to Unicorn, it depends only on your last 30 sessions (percentage of points taken).</li><li><b>Trophies:</b> rare, awarded automatically.</li><li><b>Records:</b> they're broken on their own, on the Career screen.</li><li><b>Rewards:</b> yours to set. Choose something real and a condition (level, wins, streak, focus hours…). It unlocks on its own; you claim it whenever you like.</li></ul>","The review agent","<p>The agent runs a series of detectors on your data every time you open its section: daily execution, projects, quests, goals, assessments, library, network. Each detector has a numeric threshold and says nothing below it.</p>\n      <ul class=\"rules\"><li>Three severities: <b>urgent</b>, <b>to fix</b>, <b>to watch</b>. Each finding cites the numbers that triggered it.</li><li>A finding can become a quest in one click, or be set aside for {0} days.</li><li><b>Freeze the review</b> keeps a snapshot of the day's state; next time, the agent knows what's been fixed and what's still lingering.</li><li>The <b>Tracking</b> tab shows what the agent recommended and what you did with it.</li><li>Claude's reading only gets the numbers and the findings.</li></ul>","The Library","<p>Everything you read or listen to — books, articles, courses, case studies, podcasts — and the notes that go with them.</p>\n      <ul class=\"rules\"><li>Three columns: to read, in progress, done. Progress is tracked in percentage or pages.</li><li>A note is always attached to a reading, with its type (<b>idea</b>, <b>quote</b>, <b>question</b>, <b>action</b>, <b>disagreement</b>) and its page. The <b>Notes</b> tab gathers them all, with search and pinning.</li><li>An \"action\" note turns into a Market quest: it's the only path between a reading and a session.</li><li>Notes earn no XP. Finishing with the key takeaway gives {0}, applying it gives {1} more.</li></ul>","Network and Moodboard","<ul class=\"rules\"><li><b>Network:</b> clients, prospects, investors, mentors. Every contact has a follow-up cadence; overdue ones surface on the Session screen.</li><li><b>Moodboard:</b> images, quotes, colors, notes and links. Pin an item (★) to revisit it every day on the Session screen.</li></ul>","The focus timer","<ul class=\"rules\"><li>Blocks of 25, 50 or 90 minutes, linked to a quest or not.</li><li>A completed block earns {0} XP, up to a limit of {1} blocks per day. It doesn't change the session score.</li><li>Time remaining shows in the browser tab; a sound signals the end (can be turned off in Settings › Session).</li></ul>","Settings, language and colours","<ul class=\"rules\"><li>Everything is configurable: scoring, XP, day types, reallocation window, number of goals.</li><li>Each session keeps the rules it was played with: changing a setting never rewrites the past.</li><li><b>Language:</b> French, English or Spanish, at any time. Your own text isn't translated.</li><li><b>Appearance:</b> light or dark theme, colour palettes or custom colours, colour-blind-friendly result colours.</li></ul>","Your data","<ul class=\"rules\"><li>Opened in Claude: your data lives in the page's private database, with an automatic backup every week.</li><li>As a standalone file: it stays in this browser. Export it regularly as JSON (Settings › Data).</li><li>An import replaces all data, after confirmation.</li><li><b>Fresh start</b> (Settings › Data) resets the season to a clean date and clears the warm-up sessions before it. Projects, portfolio, routine, quests, library and network are kept.</li></ul>","Keyboard shortcuts","<ul class=\"rules\"><li><b>/</b> search</li><li><b>Q</b> new quest</li><li><b>N</b> quick note</li><li><b>M</b> today's session</li><li><b>Esc</b> close a window</li></ul>","\n  <div class=\"viewhead\"><div class=\"grow\"><div class=\"eyebrow\">How it works</div><h1>Guide</h1></div><button type=\"button\" class=\"btn btn-sm\" data-a=\"go\" data-tab=\"match\" data-today=\"1\">Back to the game</button></div>\n  <div class=\"chips guide-toc\">{0}</div>\n  <div class=\"guide\">{1}</div>","Score","Routines","Goals","Review agent","Notifications","Language","Appearance","Data","Advanced","<div class=\"sfield\"><label class=\"lbl\" for=\"{0}\">{1}</label><input type=\"number\" id=\"{2}\" data-c=\"set\" data-path=\"{3}\" data-type=\"num\" min=\"{4}\" max=\"{5}\" step=\"{6}\" value=\"{7}\"><span class=\"def\">default {8}{9}</span></div>","yes","no","<div class=\"sfield chk-field\"><label class=\"switch\"><input type=\"checkbox\" id=\"{0}\" data-c=\"set\" data-path=\"{1}\" data-type=\"bool\" {2}><span>{3}</span></label><span class=\"def\">default {4}</span></div>","<div class=\"sfield\"><label class=\"lbl\" for=\"{0}\">{1}</label><select id=\"{2}\" data-c=\"set\" data-path=\"{3}\" data-type=\"str\">{4}</select><span class=\"def\">default {5}</span></div>","<button type=\"button\" class=\"btn btn-sm btn-ghost\" data-a=\"setRestore\" data-sec=\"{0}\">Restore default values</button>","\n  <div class=\"viewhead\"><div class=\"grow\"><div class=\"eyebrow\">Rules, routine, data</div><h1>Settings</h1></div></div>\n  <div class=\"set-layout\">\n    <nav class=\"set-nav\" aria-label=\"Settings sections\">{0}</nav>\n    <div class=\"set-body\">{1}</div>\n  </div>","Current season: {0}","Create a season","90-day target milestones","Done","<li><div class=\"grow1\"><div class=\"title n\">{0}</div><div class=\"meta\">{1}{2}</div></div><button type=\"button\" class=\"btn btn-xs btn-ghost\" data-a=\"capStepDel\" data-s=\"{3}\" data-id=\"{4}\">Remove</button></li>","<p class=\"small muted\">No milestones yet: the target's status can't be estimated.</p>","{0}\n    <form class=\"formbox\" data-f=\"capStepAdd\" data-s=\"{1}\"><div class=\"form-row\"><div class=\"grow\"><label class=\"lbl\" for=\"cms-t\">New milestone</label><input type=\"text\" id=\"cms-t\" class=\"draft\" name=\"title\" maxlength=\"120\"></div><div class=\"fix\"><label class=\"lbl\" for=\"cms-d\">Deadline</label><input type=\"date\" id=\"cms-d\" class=\"draft\" name=\"due\"></div><button type=\"submit\" class=\"btn\">Add</button></div></form>","+{0} XP per milestone","All seasons","Finished","<li><div class=\"grow1\"><div class=\"title\">{0}</div><div class=\"meta\"><span class=\"due\">{1} → {2}</span>{3}</div></div><button type=\"button\" class=\"btn btn-xs btn-ghost\" data-a=\"seasonView\" data-id=\"{4}\">View</button></li>","<ul class=\"rows\">{0}</ul>\n    <div class=\"hr\"></div><div class=\"eyebrow\">Set up the next season</div><p class=\"small muted\" style=\"margin:4px 0 10px\">Career XP, trophies and records carry over; season XP starts back at zero.</p>{1}","Session score","Weight of the 3 levers","Routine weight","Weight of the close-out","Win threshold","Draw threshold","Rounding","Nearest","Down","<tr><td>{0}</td><td><label class=\"sr\" for=\"dtc-{1}\">Levers required</label><input type=\"number\" id=\"dtc-{2}\" data-c=\"set\" data-path=\"dayTypes.{3}.coups\" data-type=\"num\" min=\"0\" max=\"3\" step=\"1\" value=\"{4}\" class=\"w70\"></td><td><label class=\"switch\"><input type=\"checkbox\" id=\"dtr-{5}\" data-c=\"set\" data-path=\"dayTypes.{6}.routine\" data-type=\"bool\" {7}><span class=\"sr\">Routine counted</span></label></td></tr>","<p class=\"small\">The score measures the day's execution, out of 100. It's separate from XP (what you've accomplished), points (consistency) and level (experience).</p>\n  <div class=\"sgrid\">{0}{1}{2}</div>\n  <div class=\"sgrid\">{3}{4}{5}</div>\n  <div class=\"eyebrow\" style=\"margin-top:12px\">Weight of levers by type</div>\n  <div class=\"sgrid\">{6}{7}{8}</div>\n  <div class=\"eyebrow\" style=\"margin-top:12px\">Session types</div>\n  <div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th>Type</th><th>Levers required</th><th>Routine counted</th></tr></thead><tbody>{9}<tr><td>Day off</td><td colspan=\"2\" class=\"muted small\">Neutral, weekly quota set in the season</td></tr></tbody></table></div>\n  <p class=\"small muted\" style=\"margin-top:10px\">Rules version: v{10}. Every completed session keeps the rules it was played with: a change here never modifies a past score.</p>\n  <div class=\"row-wrap\" style=\"margin-top:8px\">{11}</div>","Ship quest","Market quest","Groundwork quest","Flagship project multiplier","Active project multiplier","On-watch project multiplier","On-ice project multiplier","Weekly goal","Monthly goal","Season goal","Weekly revi ones este mes","inactivos","Por contactar","Inactivos","Prospectos","Clientes","Inversores","Mentores","<div class=\"chips\" style=\"margin-bottom:12px\"><span class=\"muted small\">Etiquetas:</span>{0}</div>","Ningún contacto en este filtro.","Sin contactos. Empieza por 10 personas clave: clientes, prospectos, inversores, mentores. Ejemplo: «Directora de compras, pyme industrial, conocida en la feria de septiembre».","<button type=\"button\" class=\"btn btn-sm\" data-a=\"quick\" data-kind=\"contact\">Añadir un contacto</button>","\n  <div class=\"viewhead\"><div class=\"grow\"><div class=\"eyebrow\">El negocio se juega en la red</div><h1>Red</h1></div><button type=\"button\" class=\"btn btn-primary\" data-a=\"quick\" data-kind=\"contact\">Nuevo contacto</button></div>\n  <div class=\"kpis top\">{0}{1}{2}{3}</div>\n  <div class=\"view-top\">{4}</div>\n  <section class=\"card\">\n    <div class=\"chips\" style=\"margin-bottom:10px\">{5}{6}{7}{8}{9}{10}{11}{12}</div>\n    {13}\n    {14}\n  </section>","<span class=\"cstatus late\">Por contactar</span>","<span class=\"cstatus ok\">Próximo seguimiento {0}</span>","última interacción hace {0} d","nunca contactado"," · <span class=\"muted\">misión abierta</span>","<p class=\"small\" style=\"margin-top:4px\"><b>Próxima acción:</b> {0}{1}</p>","<button type=\"button\" class=\"btn btn-xs\" data-a=\"netNote\" data-id=\"{0}\">Contacto hecho · +{1}</button>","<button type=\"button\" class=\"btn btn-xs btn-ghost\" data-a=\"netToQuest\" data-id=\"{0}\">Crear una misión de Mercado</button>","Detalles","<form class=\"form-row\" data-f=\"netLog\" data-id=\"{0}\" style=\"margin-top:8px\"><div class=\"grow\"><label class=\"lbl\" for=\"cn-{1}\">Qué se dijo</label><input type=\"text\" id=\"cn-{2}\" class=\"draft\" name=\"note\" maxlength=\"240\" placeholder=\"Con una línea basta\"></div><button type=\"submit\" class=\"btn btn-sm btn-primary\">Guardar</button><button type=\"button\" class=\"btn btn-sm btn-ghost\" data-a=\"netNoteCancel\">Cancelar</button></form>","<option value=\"{0}\"{1}>{2} días</option>","<p class=\"small muted\">Ninguna interacción registrada.</p>","<div class=\"stack\" style=\"margin-top:10px\">\n      <div class=\"form-row\">\n        <div class=\"grow\"><label class=\"lbl\" for=\"cx-n-{0}\">Próxima acción</label><input type=\"text\" id=\"cx-n-{1}\" data-c=\"netField\" data-field=\"next\" data-id=\"{2}\" maxlength=\"200\" value=\"{3}\"></div>\n        <div class=\"fix\"><label class=\"lbl\" for=\"cx-c-{4}\">Contactar cada</label><select id=\"cx-c-{5}\" data-c=\"netField\" data-field=\"cadence\" data-id=\"{6}\">{7}</select></div>\n      </div>\n      <div class=\"form-row\">\n        <div class=\"fix\"><label class=\"lbl\" for=\"cx-r-{8}\">Rol</label><select id=\"cx-r-{9}\" data-c=\"netField\" data-field=\"role\" data-id=\"{10}\">{11}</select></div>\n        <div class=\"grow\"><label class=\"lbl\" for=\"cx-o-{12}\">Empresa u organización</label><input type=\"text\" id=\"cx-o-{13}\" data-c=\"netField\" data-field=\"org\" data-id=\"{14}\" maxlength=\"80\" value=\"{15}\"></div>\n        <div class=\"grow\"><label class=\"lbl\" for=\"cx-t-{16}\">Etiquetas (separadas por comas)</label><input type=\"text\" id=\"cx-t-{17}\" data-c=\"netField\" data-field=\"tags\" data-id=\"{18}\" maxlength=\"120\" value=\"{19}\"></div>\n      </div>\n      <div><label class=\"lbl\" for=\"cx-x-{20}\">Notas breves</label><textarea id=\"cx-x-{21}\" data-c=\"netField\" data-field=\"notes\" data-id=\"{22}\" maxlength=\"500\" rows=\"2\">{23}</textarea></div>\n      {24}\n    </div>","<li class=\"crow\" id=\"contact-{0}\">\n    <div class=\"qline\"><div class=\"grow1\"><div class=\"title\">{1}</div>\n      <div class=\"meta\"><span class=\"chip\">{2}</span>{3}{4}<span class=\"due\">{5} · cada {6} d</span>{7}</div>\n      {8}</div>\n      <div class=\"acts\">{9}{10}<button type=\"button\" class=\"btn btn-xs btn-ghost\" data-a=\"netOpen\" data-id=\"{11}\">{12}</button>{13}</div></div>\n    {14}\n    {15}\n  </li>","El principio","<p>Cada día es una sesión puntuada sobre 100. Eliges 3 palancas (misiones concretas), haces tu rutina y luego cierras la sesión por la noche.</p>\n      <ul class=\"rules\"><li>{0} o más: victoria. De {1} a {2}: empate. Por debajo: derrota.</li><li>Un día sin ningún registro se pierde por incomparecencia.</li><li>La temporada dura varios meses; la carrera, en cambio, no se acaba nunca.</li></ul>","Un día típico","<ol class=\"rules\"><li><b>Por la mañana:</b> elige tus 3 palancas del día en la pantalla Sesión y luego abre la sesión para bloquear tu plan.</li><li><b>Durante el día:</b> activa tus palancas, marca tu rutina, inicia un bloque de foco cuando necesites concentrarte.</li><li><b>Por la noche:</b> cierre. Lo que se ha entregado, el bloqueo principal, el ajuste para mañana. Menos de dos minutos.</li><li><b>Al día siguiente:</b> la sesión del día anterior se bloquea automáticamente, con las reglas vigentes ese día.</li></ol>","Puntuación, puntos, XP y nivel","<ul class=\"rules\"><li><b>Puntuación (sobre 100):</b> la ejecución del día. Palancas {0} puntos, rutina {1}, cierre {2}.</li><li><b>Puntos:</b> la regularidad. Victoria 3, empate 1, derrota e incomparecencia 0. Determinan tu forma y tu división.</li><li><b>XP:</b> lo que has logrado (misiones, hábitos, objetivos, balances, saber, red, foco). Nunca se pierde.</li><li><b>Nivel:</b> calculado sobre el XP de carrera. Cada nivel tiene un título, de Promotor de idea a Leyenda del emprendimiento.</li></ul>","Los tipos de día","<ul class=\"rules\"><li><b>Normal</b> o <b>alta intensidad:</b> 3 palancas requeridas.</li><li><b>Recuperación</b> o <b>viaje:</b> 1 palanca requerida.</li><li><b>Imprevisto:</b> 1 palanca, que debe declararse con un motivo, incluso a posteriori.</li><li><b>Día libre:</b> descanso planificado. La sesión no cuenta y la racha continúa. El número de días libres por semana se ajusta en la temporada.</li></ul>","La cartera","<p>Tres proyectos en juego como máximo: un proyecto estrella (XP × {0}) y dos proyectos activos (× {1}). Los proyectos en espera (× {2}) esperan su turno; los congelados (× {3}) están en pausa.</p>\n      <ul class=\"rules\"><li>Todo cambio es una reasignación: por defecto, entra en vigor en la próxima sesión.</li><li>Un proyecto en juego sin ninguna acción de Mercado o Entregar desde hace 7 días se marca como estancado.</li><li>Las áreas de vida (cuerpo, mente, dinero, relaciones) se quedan siempre en × 1.</li></ul>","Las misiones","<p>Una misión es binaria: hecha o no. Su tipo indica su naturaleza, su prioridad su importancia.</p>\n      <ul class=\"rules\"><li><b>Entregar</b> ({0} XP): lo que sale de tu cabeza hacia el mundo.</li><li><b>Mercado</b> ({1} XP): un contacto real con un cliente, un prospecto, un inversor.</li><li><b>Fondo</b> ({2} XP): preparar, estudiar, organizar.</li><li>Aplazada {3} veces, una misión se marca como bloqueada: divídela o redefínela.</li><li>Antifarming: {4} misiones dan XP por día, de las cuales {5} no planificadas.</li></ul>","Los objetivos","<p>Visión (a varias temporadas) › meta a 90 días › objetivos de temporada › del mes › de la semana › misiones.</p>\n      <ul class=\"rules\"><li>Como máximo {0} objetivos por temporada, {1} por mes y {2} por semana. Más allá de eso, es dispersión.</li><li>Un objetivo no alcanzado puede trasladarse al siguiente período.</li><li>Vincula tus misiones a un objetivo para ver qué avanza de verdad.</li></ul>","Balances e informe del consejo","<ul class=\"rules\"><li>Balance de la semana (+{0} XP), del mes (+{1} XP) y de la temporada (+{2} XP). El balance de la semana requiere una prueba de mercado y el importe cobrado.</li><li>El informe del consejo calcula las cifras del período.</li><li>La interpretación de Claude se basa únicamente en estas cifras y en el contexto que escribes en Ajustes › Avanzado.</li></ul>","Divisiones, trofeos y recompensas","<ul class=\"rules\"><li><b>División:</b> de Presemilla a Unicornio, depende únicamente de tus últimas 30 sesiones (porcentaje de puntos conseguidos).</li><li><b>Trofeos:</b> raros, se otorgan automáticamente.</li><li><b>Récords:</b> se baten solos, en la pantalla Carrera.</li><li><b>Recompensas:</b> las tuyas. Elige algo real y una condición (nivel, victorias, racha, horas de foco…). Se desbloquea sola; la canjeas cuando quieras.</li></ul>","El agente de revisión","<p>El agente pasa una serie de detectores sobre tus datos cada vez que abres su sección: ejecución diaria, proyectos, misiones, objetivos, balances, biblioteca, red. Cada detector tiene un umbral numérico y no dice nada por debajo de él.</p>\n      <ul class=\"rules\"><li>Tres gravedades: <b>urgente</b>, <b>por corregir</b>, <b>a vigilar</b>. Cada hallazgo cita las cifras que lo desencadenaron.</li><li>Un hallazgo puede convertirse en misión con un clic, o aplazarse {0} días.</li><li><b>Fijar la revisión</b> guarda una foto del estado del día; la próxima vez, el agente sabe qué se resolvió y qué sigue pendiente.</li><li>La pestaña <b>Seguimiento</b> muestra lo que el agente recomendó y lo que hiciste con ello.</li><li>La lectura de Claude solo recibe las cifras y los hallazgos.</li></ul>","La Biblioteca","<p>Todo lo que lees o escuchas — libros, artículos, cursos, casos de estudio, podcasts — y las notas que las acompañan.</p>\n      <ul class=\"rules\"><li>Tres columnas: por leer, en curso, terminado. El progreso se sigue en porcentaje o en páginas.</li><li>Una nota siempre está vinculada a una lectura, con su tipo (<b>idea</b>, <b>cita</b>, <b>pregunta</b>, <b>acción</b>, <b>desacuerdo</b>) y su página. La pestaña <b>Notas</b> las reúne todas, con búsqueda y anclaje.</li><li>Una nota «acción» se convierte en misión Mercado: es el único camino entre una lectura y una sesión.</li><li>Las notas no dan XP. Terminar con la idea clave da {0}, aplicarla da {1} más.</li></ul>","Red y Moodboard","<ul class=\"rules\"><li><b>Red:</b> clientes, prospectos, inversores, mentores. Cada contacto tiene una cadencia de seguimiento; los retrasos aparecen en la pantalla Sesión.</li><li><b>Moodboard:</b> imágenes, citas, colores, notas y enlaces. Fija un elemento (★) para revisarlo cada día en la pantalla Sesión.</li></ul>","El cronómetro de foco","<ul class=\"rules\"><li>Bloques de 25, 50 o 90 minutos, vinculados o no a una misión.</li><li>Un bloque terminado da {0} XP, con un límite de {1} bloques por día. No cambia la puntuación de la sesión.</li><li>El tiempo restante se muestra en la pestaña del navegador; una señal sonora marca el final (desactivable en Ajustes › Sesión).</li></ul>","Ajustes, idioma y colores","<ul class=\"rules\"><li>Todo se puede ajustar: baremo, XP, tipos de día, ventana de reasignación, número de objetivos.</li><li>Cada sesión conserva las reglas con las que se jugó: cambiar un ajuste nunca reescribe el pasado.</li><li><b>Idioma:</b> francés, inglés o español, en cualquier momento. Tus propios textos no se traducen.</li><li><b>Apariencia:</b> tema claro u oscuro, paletas de colores o colores libres, colores de resultados adaptados al daltonismo.</li></ul>","Tus datos","<ul class=\"rules\"><li>Abierto en Claude: tus datos viven en la base de datos privada de la página, con una copia de seguridad automática cada semana.</li><li>Como archivo independiente: se quedan en este navegador. Expórtalos regularmente en JSON (Ajustes › Datos).</li><li>Una importación reemplaza todos los datos, tras confirmación.</li><li><b>Nuevo comienzo</b> (Ajustes › Datos) recoloca la temporada en una fecha limpia y borra las sesiones de rodaje que la preceden. Proyectos, cartera, rutina, misiones, biblioteca y red se conservan.</li></ul>","Atajos de teclado","<ul class=\"rules\"><li><b>/</b> buscar</li><li><b>Q</b> nueva misión</li><li><b>N</b> nota rápida</li><li><b>M</b> sesión del día</li><li><b>Esc</b> cerrar una ventana</li></ul>","\n  <div class=\"viewhead\"><div class=\"grow\"><div class=\"eyebrow\">Modo de uso</div><h1>Guía</h1></div><button type=\"button\" class=\"btn as requeridas</th><th>Rutina contabilizada</th></tr></thead><tbody>{9}<tr><td>Día libre</td><td colspan=\"2\" class=\"muted small\">Neutro, cuota semanal ajustada en la temporada</td></tr></tbody></table></div>\n  <p class=\"small muted\" style=\"margin-top:10px\">Versión de las reglas: v{10}. Cada sesión terminada conserva las reglas con las que se jugó: un cambio aquí nunca modifica una puntuación pasada.</p>\n  <div class=\"row-wrap\" style=\"margin-top:8px\">{11}</div>","Misión de Entregar","Misión de Mercado","Misión de Fondo","Multiplicador proyecto estrella","Multiplicador proyecto activo","Multiplicador proyecto en espera","Multiplicador proyecto congelado","Objetivo semanal","Objetivo mensual","Objetivo de temporada","Balance semanal","Balance mensual","Balance de temporada","Saber terminado (idea clave)","Interacción de red","Hito de reto","Bloque de foco terminado","Bloques de foco con XP al día","Misiones que dan XP al día","más allá: 0 XP","De las cuales no planificadas","creadas y hechas el mismo día","<p class=\"small\">El XP mide lo que se ha logrado. Nunca se pierde: solo un registro anulado retira su propia ganancia.</p>\n  <div class=\"sgrid\">{0}{1}{2}</div>\n  <div class=\"sgrid\">{3}{4}{5}{6}</div>\n  <div class=\"sgrid\">{7}{8}{9}{10}{11}</div>\n  <div class=\"sgrid\">{12}{13}{14}{15}{16}{17}</div>\n  <div class=\"sgrid\">{18}{19}{20}{21}{22}</div>\n  <div class=\"eyebrow\" style=\"margin-top:12px\">Antifarming</div>\n  <div class=\"sgrid\">{23}{24}</div>\n  <p class=\"small muted\">El XP de los hábitos se ajusta en Rutinas. Un cambio aquí no modifica el XP ya ganado.</p>\n  <div class=\"row-wrap\" style=\"margin-top:8px\">{25}</div>","Tipo de sesión por defecto","Proponer la apertura cada mañana","Señal sonora al final de un bloque de foco","Tipo por defecto","Prioridad por defecto","Marcar como bloqueada después de","Cartera y reasignaciones","Ventana de reasignación","<div class=\"sgrid\">{0}</div><p class=\"small muted\">Por defecto, un ca os»","<div class=\"sgrid\"><div class=\"sfield\"><label class=\"lbl\" for=\"set-clubName\">Nombre mostrado en la parte superior de la pantalla</label><input type=\"text\" id=\"set-clubName\" data-c=\"set\" data-path=\"clubName\" data-type=\"str\" maxlength=\"24\" value=\"{0}\"><span class=\"def\">por defecto «{1}»</span></div></div>\n    <div class=\"sgrid\">{2}{3}{4}</div>\n    <div class=\"eyebrow\" style=\"margin-top:16px\">Colores</div>\n    <div class=\"pal-grid\">{5}</div>\n    <div class=\"sgrid\">{6}{7}{8}</div>\n    <p class=\"small muted\" style=\"margin-top:6px\">Tocar un color activa la paleta personalizada. Los tonos derivados (fondos, estados al pasar el cursor, modo oscuro) se recalculan para seguir siendo legibles.</p>\n    <div class=\"sgrid\">{9}{10}{11}</div>\n    {12}\n    <div class=\"row-wrap\" style=\"margin-top:8px\">{13}</div>","<option value=\"\">Sin área</option>","<option value=\"{0}\"{1}>{2} XP</option>","Archivar","<div class=\"hedit\">\n    <input type=\"text\" id=\"hn-{0}\" data-c=\"habitField\" data-field=\"name\" data-id=\"{1}\" maxlength=\"80\" value=\"{2}\" aria-label=\"Nombre del hábito\">\n    <select id=\"hb-{3}\" data-c=\"habitField\" data-field=\"block\" data-id=\"{4}\" aria-label=\"Momento\">{5}</select>\n    <select id=\"hx-{6}\" data-c=\"habitField\" data-field=\"xp\" data-id=\"{7}\" aria-label=\"XP\">{8}</select>\n    <select id=\"ha-{9}\" data-c=\"habitField\" data-field=\"area\" data-id=\"{10}\" aria-label=\"Área\">{11}</select>\n    {12}\n    <div class=\"days7\" role=\"group\" aria-label=\"Días previstos\">{13}</div></div>","<p class=\"small muted\">Ningún hábito activo.</p>","<li><div class=\"grow1 small\">{0}</div><span class=\"due\">desde el {1}</span></li>","<div class=\"hr\"></div><div class=\"eyebrow\">Archivadas</div><ul class=\"rows\">{0}</ul>","{0}\n    <p class=\"small muted\" style=\"margin-top:10px\">Cambiar los días se aplica a partir de hoy: las sesiones pasadas conservan su puntuación. El área alimenta   AG_DETECTORS.forEach(d => {

    if (!f) return;

    f.since = isKey(seen[f.key]) ? seen[f.key] : T;

    out.push(f);

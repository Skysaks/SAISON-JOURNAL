:root{
  --bg:#F2F1F6;--surface:#FFFFFF;--surface-2:#F6F5FA;--ink:#1B1726;--ink-2:#3E3850;--muted:#5F586D;--line:#E0DCE9;--line-2:#C9C3D6;
  --accent:#5B2A86;--accent-mid:#9C78C4;--accent-ink:#FFFFFF;--accent-soft:#EFE8F7;
  --gold:#8A6207;--gold-bar:#D9A21B;--gold-soft:#F7EED6;
  --win:#1C7F46;--win-bg:#DCF1E4;--draw-c:#C99A06;--draw-t:#7A5C00;--draw-bg:#FBF1CF;--loss:#B9322A;--loss-bg:#F8E0DC;--rest:#3F6690;--rest-bg:#DFE8F3;
  --ok:#2B6CB0;--ok-bg:#E1ECF8;--risk:#A2530A;--risk-bg:#FBE9D8;
  --board:#1B1726;--board-ink:#F3EFFA;--board-muted:#B5ADC6;--board-line:#3A3349;
  --pad:16px;--gap:16px;
  --f-d:"Big Shoulders Display","Big Shoulders","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-b:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#100E15;--surface:#19161F;--surface-2:#201C29;--ink:#EEEAF5;--ink-2:#D2CBDE;--muted:#ABA3BA;--line:#2D2838;--line-2:#3D3749;
    --accent:#B58BE3;--accent-mid:#7D5BA6;--accent-ink:#1A0E27;--accent-soft:#2A2136;
    --gold:#E7BA52;--gold-bar:#E4B54A;--gold-soft:#2E2715;
    --win:#4CC784;--win-bg:#16301F;--draw-c:#E9C23A;--draw-t:#F0CF5A;--draw-bg:#322A10;--loss:#F06B5F;--loss-bg:#3A1B19;--rest:#8DB1DE;--rest-bg:#1A2638;
    --ok:#7FB2EA;--ok-bg:#16263A;--risk:#F2A35A;--risk-bg:#3A2614;
    --board:#1F1B28;--board-ink:#F3EFFA;--board-muted:#B5ADC6;--board-line:#3A3349;
    color-scheme:dark;
  }
}
:root[data-theme="dark"],body.th-dark{
  --bg:#100E15;--surface:#19161F;--surface-2:#201C29;--ink:#EEEAF5;--ink-2:#D2CBDE;--muted:#ABA3BA;--line:#2D2838;--line-2:#3D3749;
  --accent:#B58BE3;--accent-mid:#7D5BA6;--accent-ink:#1A0E27;--accent-soft:#2A2136;
  --gold:#E7BA52;--gold-bar:#E4B54A;--gold-soft:#2E2715;
  --win:#4CC784;--win-bg:#16301F;--draw-c:#E9C23A;--draw-t:#F0CF5A;--draw-bg:#322A10;--loss:#F06B5F;--loss-bg:#3A1B19;--rest:#8DB1DE;--rest-bg:#1A2638;
  --ok:#7FB2EA;--ok-bg:#16263A;--risk:#F2A35A;--risk-bg:#3A2614;
  --board:#1F1B28;--board-ink:#F3EFFA;--board-muted:#B5ADC6;--board-line:#3A3349;
  color-scheme:dark;
}
body.th-light{
  --bg:#F2F1F6;--surface:#FFFFFF;--surface-2:#F6F5FA;--ink:#1B1726;--ink-2:#3E3850;--muted:#5F586D;--line:#E0DCE9;--line-2:#C9C3D6;
  --accent:#5B2A86;--accent-mid:#9C78C4;--accent-ink:#FFFFFF;--accent-soft:#EFE8F7;
  --gold:#8A6207;--gold-bar:#D9A21B;--gold-soft:#F7EED6;
  --win:#1C7F46;--win-bg:#DCF1E4;--draw-c:#C99A06;--draw-t:#7A5C00;--draw-bg:#FBF1CF;--loss:#B9322A;--loss-bg:#F8E0DC;--rest:#3F6690;--rest-bg:#DFE8F3;
  --ok:#2B6CB0;--ok-bg:#E1ECF8;--risk:#A2530A;--risk-bg:#FBE9D8;
  color-scheme:light;
}
body.dens-compact{--pad:12px;--gap:10px}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{max-width:1220px;margin:0 auto;padding-inline:16px;padding-block:0 72px}
#view{display:block}

/* ---------- en-tête collant */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;margin-inline:-16px;padding-inline:16px;background:var(--board);color:var(--board-ink);box-shadow:0 1px 0 var(--board-line)}
.hdr-in{display:flex;align-items:center;gap:18px;min-height:58px;padding-block:6px}
.brand{background:none;border:0;color:inherit;padding:0;text-align:left;display:grid;line-height:1;flex:none}
.brand b{font:800 26px/1 var(--f-d);letter-spacing:.03em;text-transform:uppercase}
.brand small{font-size:11.5px;letter-spacing:.06em;color:var(--board-muted);display:inline-flex;align-items:center;gap:6px;margin-top:3px}
.sync{width:7px;height:7px;border-radius:50%;background:var(--board-muted);display:inline-block}
.sync.ok{background:#4CC784}.sync.local{background:var(--gold-bar)}
.lvl{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 220px;max-width:340px}
.lvl-badge{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--gold-bar);display:grid;place-items:center;font:800 21px/1 var(--f-d);color:var(--gold-bar);font-variant-numeric:tabular-nums}
.lvl-main{display:grid;min-width:0;flex:1}
.lvl-title{font:700 16px/1.1 var(--f-d);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{height:6px;background:var(--board-line);border-radius:99px;overflow:hidden;margin:4px 0 3px;display:block}
.xpbar i{display:block;height:100%;background:var(--gold-bar);border-radius:inherit;transition:width .6s ease}
.lvl-sub{font-size:11.5px;color:var(--board-muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hform{display:flex;align-items:center;gap:4px;flex:none}
.hform-t{font-size:11.5px;color:var(--board-muted);margin-left:4px;white-space:nowrap}
.fdot{width:20px;height:20px;border-radius:5px;display:inline-grid;place-items:center;font:700 12px/1 var(--f-b);color:#fff}
.fdot.win{background:#2F9E5F}.fdot.draw{background:#C99A06;color:var(--on-gold,#1B1726)}.fdot.loss{background:#C9423A}.fdot.empty{background:transparent;box-shadow:inset 0 0 0 1px var(--board-line)}
.kpi .fdot.empty{box-shadow:inset 0 0 0 1px var(--line-2)}
.hrec{display:grid;line-height:1;text-align:center;flex:none}
.hrec b{font:800 22px/1 var(--f-d);color:var(--gold-bar)}
.hrec span{font-size:11px;color:var(--board-muted);white-space:nowrap}
.hdr-act{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.hdr .iconbtn{background:transparent;border-color:var(--board-line);color:var(--board-ink)}
.hdr .iconbtn[aria-pressed="true"]{background:var(--board-line)}
.hdr .btn-primary{background:var(--gold-bar);border-color:var(--gold-bar);color:var(--on-gold,#1B1726)}
.hdr .hdr-set{background:transparent;border-color:var(--board-line);color:var(--board-ink)}
.hdr-set svg{width:15px;height:15px}
.hdr .hdr-set[aria-pressed="true"]{background:var(--board-line)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:var(--board-muted);padding:7px 12px;border-radius:7px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tab:hover{color:var(--board-ink)}
.tab[aria-selected="true"]{background:var(--board-ink);color:var(--board)}
.cnt{font-size:11px;font-weight:700;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--loss);color:#fff;display:inline-grid;place-items:center}
@media (max-width:1060px){.hrec{display:none}}
@media (max-width:719px){
  .hdr-in{gap:10px;min-height:52px}
  .brand,.tabs,.hform-t,.lvl-sub,.lvl-title{display:none}
  .hide-phone{display:none!important}
  .hdr .show-phone{display:inline}
  .lvl{flex:1 1 auto;max-width:none}
  .hdr-match{padding-inline:10px}
}
#banner{margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--gold-soft);border:1px solid var(--gold);font-size:14px}

/* ---------- navigation mobile */
.show-phone{display:none}
.bnav{display:none}
.fab{display:none}
@media (max-width:719px){
  #app{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bn{position:relative;border:0;background:none;display:grid;justify-items:center;gap:2px;padding:8px 2px 7px;min-height:56px;color:var(--muted);font-size:11.5px;font-weight:600}
  .bn svg{width:20px;height:20px}
  .bn.on{color:var(--accent)}
  .bn .cnt{position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;height:16px;font-size:10px}
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:44;width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font:700 28px/1 var(--f-b);box-shadow:0 8px 24px rgba(0,0,0,.28)}
}

/* ---------- structure */
.viewhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 12px}
.viewhead h1{margin:0;font:800 32px/1 var(--f-d);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.viewhead .grow{flex:1 1 200px;min-width:0}
.view-top{margin:14px 0}
.view-top:empty{display:none}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:var(--gap);align-items:start}
.col{display:grid;gap:var(--gap);min-width:0;align-content:start}
@media (max-width:919px){.grid2{grid-template-columns:minmax(0,1fr)}}
#view>.col{margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:var(--pad) calc(var(--pad) + 2px);min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:6px 12px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2{margin:0;font:700 20px/1.1 var(--f-d);text-transform:uppercase;letter-spacing:.04em}
.card-h h2.h3,.h3{font-size:17px}
.card-r{font-size:13px;color:var(--muted)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:13.5px}
.stack{display:grid;gap:10px}
.hr{border-top:1px dashed var(--line);margin:14px 0}
.row-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.empty{display:grid;gap:10px;justify-items:start;color:var(--muted);font-size:14px}
.neg{color:var(--loss)}.pos{color:var(--win)}
.alert{border:1px solid var(--loss);background:var(--loss-bg);border-radius:10px;padding:10px 14px;font-size:14px;margin:0 0 14px}
.next{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:10px 14px}
.next-l{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.next-t{flex:1 1 200px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.seg-nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:16px 0 4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;width:max-content;max-width:100%}
.seg-nav::-webkit-scrollbar{display:none}
.seg-nav button{flex:none;border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.seg-nav button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.seg-nav.sm{margin:0 0 12px}

/* ---------- boutons et contrôles */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 13px;font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--ink-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover:not(:disabled){border-color:var(--accent);filter:brightness(1.08)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn-ghost:hover:not(:disabled){color:var(--ink);border-color:var(--line-2)}
.btn-sm{padding:5px 11px;font-size:13.5px}
.btn-xs{padding:4px 9px;font-size:12.5px;border-radius:6px}
.btn.danger{background:var(--loss);border-color:var(--loss);color:#fff}
.btn.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.iconbtn{flex:none;width:36px;height:36px;display:inline-grid;place-items:center;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);padding:0;color:var(--ink)}
.iconbtn svg{width:16px;height:16px}
.iconbtn:disabled{opacity:.35;cursor:not-allowed}
.iconbtn.sm{width:30px;height:30px;border-color:transparent;background:transparent;color:var(--muted)}
.iconbtn.sm:hover{color:var(--loss)}
.chk{position:relative;flex:none;width:26px;height:26px;border-radius:7px;border:2px solid var(--line-2);background:var(--surface);display:grid;place-items:center;color:transparent;padding:0;transition:background .15s,border-color .15s,transform .15s}
.chk::after{content:"";position:absolute;inset:-9px}
.chk svg{width:15px;height:15px}
.chk:hover:not(:disabled){border-color:var(--accent)}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk:disabled{cursor:not-allowed;opacity:.45}
.chipbtn{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.chipbtn span{color:var(--muted);font-weight:500}
.chipbtn.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chipbtn.on span{color:var(--bg);opacity:.75}
.chipbtn.sm{padding:3px 9px;font-size:12.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=date],input[type=number],input[type=search],input[type=time],select,textarea{width:100%;min-width:0;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:14.5px;line-height:1.35;color:var(--ink)}
input[type=file]{font-size:14px;max-width:100%}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.85}
textarea{resize:vertical;min-height:62px}
.form-row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.form-row>.grow{flex:1 1 200px;min-width:0}
.form-row>.fix{flex:1 1 140px;min-width:0;max-width:240px}
.form-row>.tiny{flex:0 1 96px;min-width:0}
.formbox{border:1px dashed var(--line-2);border-radius:12px;padding:12px;display:grid;gap:10px;background:var(--surface-2);margin-top:12px}
.switch{display:inline-flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--accent)}
.w70{max-width:80px}
@media (pointer:coarse){
  .btn,.btn-sm,.btn-xs{min-height:44px}
  .iconbtn,.iconbtn.sm{width:44px;height:44px}
  input[type=text],input[type=date],input[type=number],input[type=search],input[type=time],select{min-height:44px}
  .chipbtn{min-height:40px}
  .seg button,.days7 button{min-width:44px;min-height:44px}
}

/* ---------- étiquettes */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.chip.strong{font-weight:700;color:var(--ink);font-size:13.5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.lg{width:11px;height:11px}
.kind{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 6px;border-radius:4px;white-space:nowrap}
.kind-livrer{background:var(--accent);color:var(--accent-ink)}
.kind-terrain{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.kind-fond{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-2)}
.prio{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:4px;white-space:nowrap}
.prio-critique{background:var(--gold-soft);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.prio-importante{color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold-bar)}
.prio-faible{color:var(--muted)}
.xp{font-size:12.5px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:3px}
.due{font-size:12.5px;color:var(--muted);white-space:nowrap}
.due.late{color:var(--loss);font-weight:600}
.due.now{color:var(--accent);font-weight:600}
.link-chip{font-size:12px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:12px;color:var(--accent)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill-win{background:var(--win-bg);color:var(--win)}
.pill-draw{background:var(--draw-bg);color:var(--draw-t)}
.pill-loss{background:var(--loss-bg);color:var(--loss)}
.pill-rest{background:var(--rest-bg);color:var(--rest)}
.pill-live{background:var(--accent-soft);color:var(--accent)}
.pill-pre{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.pill-ok{background:var(--ok-bg);color:var(--ok)}
.pill-risk{background:var(--risk-bg);color:var(--risk)}

/* ---------- KPI */
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.kpis.top{margin:0 0 4px}
.kpi{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 11px;display:inline-flex;gap:7px;align-items:baseline}
.kpi b{font:800 21px/1 var(--f-d);font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.kpi.gold b{color:var(--gold)}
.fdots{display:inline-flex;gap:3px}

/* ---------- match */
.match{display:grid;gap:12px}
.match-date{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.match-date .grow{flex:1 1 180px;min-width:0}
.match-title{margin:3px 0 0;font:800 32px/1 var(--f-d);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.type-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sel-type{width:auto;min-width:170px;font-weight:600}
.match-score{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.score-num{font:800 96px/.82 var(--f-d);font-variant-numeric:tabular-nums;min-width:1.2ch}
.score-num.win{color:var(--win)}.score-num.draw{color:var(--draw-c)}.score-num.loss{color:var(--loss)}.score-num.rest{color:var(--rest)}.score-num.live{color:var(--accent)}.score-num.pre{color:var(--muted)}
.score-num.pulse{animation:pulse .6s ease}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
.score-meta{display:grid;gap:8px;flex:1 1 240px;min-width:0}
.scale{position:relative;height:10px;border-radius:99px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.scale i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:inherit;transition:width .5s ease}
.scale u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.35}
.scale-lg{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;gap:6px}
.prematch,.report{border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:10px}
.pm-grid{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.pm-grid .grow{flex:1 1 220px;min-width:0}
.ko-done{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:12px}
.rep-grid{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 13px;font-weight:700;font-variant-numeric:tabular-nums;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.slots{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.slot{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);min-width:0}
.slot.bonus{opacity:.85}
.slot-n{flex:none;font:800 24px/1 var(--f-d);color:var(--muted);width:16px;text-align:center}
.slot-body{flex:1;min-width:0}
.slot-title{font-weight:600;overflow-wrap:anywhere}
.slot.is-done .slot-title{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.slot.empty{border-style:dashed;background:transparent}
.slot.empty select{flex:1}
.hat{font-size:13.5px;color:var(--muted);margin-top:10px}
.hat b{color:var(--gold)}
.rows{list-style:none;margin:0;padding:0}
.rows>li{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
.rows>li:last-child{border-bottom:0}
.grow1{flex:1;min-width:0}
.title{font-weight:600;overflow-wrap:anywhere}
.title.n{font-weight:500}
.is-done .title{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.block-h{margin:12px 0 0}
.block-h:first-child{margin-top:0}
.hab-streak{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.brief{border-color:var(--accent);background:linear-gradient(0deg,var(--surface),var(--surface)) padding-box}
.brief-t{font-size:16px;font-weight:600;margin:6px 0 10px;line-height:1.4}
.north{border:2px solid var(--gold-bar)}
.cap-text{font-weight:600;font-size:15.5px;margin-bottom:8px}
.cap-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px;margin-bottom:10px}
.cap-meta b{font:800 22px/1 var(--f-d);color:var(--gold)}
.armband{flex:none;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:5px;background:var(--gold-bar);color:var(--on-gold,#1B1726);font:800 14px/1 var(--f-d)}
.armband.sm{width:18px;height:18px;font-size:11px}
.dual{position:relative;margin:4px 0 4px}
.tmark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);transform:translateX(-1px)}
.clog{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px;font-size:13.5px;color:var(--ink-2)}
.clog b{color:var(--muted);font-weight:600;margin-right:6px;font-variant-numeric:tabular-nums}

/* ---------- progression, objectifs, bilans */
.prog{height:8px;border-radius:99px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.prog.thin{height:6px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .4s ease}
.prog.done i{background:var(--win)}
.goal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.goal:last-of-type{border-bottom:0}
.goal .prog{grid-column:1/-1}
.goal-act{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.goal-num{font:700 18px/1 var(--f-d);font-variant-numeric:tabular-nums;white-space:nowrap}
.goal-num small{font:500 12px var(--f-b);color:var(--muted)}
.stepper{display:inline-flex;gap:4px}
.stepper .iconbtn{width:32px;height:32px;font-weight:700}
@media (max-width:560px){.goal{grid-template-columns:minmax(0,1fr)}.goal-act{justify-content:flex-start}}
.auto{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2);display:grid;gap:8px;margin-bottom:12px}
.facts{margin:0;padding-left:18px;display:grid;gap:5px;font-size:14px}
.facts li.cur{font-weight:700;color:var(--accent)}
.coach{display:grid;gap:6px}
.debrief{white-space:pre-wrap;font-size:14px;line-height:1.55;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px}
.toggle2{display:inline-flex;gap:6px}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.sday{border:1px solid var(--line);border-radius:10px;padding:8px 2px;text-align:center;background:var(--surface-2);display:grid;gap:3px;min-width:0;color:var(--ink)}
.sday .d{font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.sday b{font:800 22px/1 var(--f-d);font-variant-numeric:tabular-nums}
.sday .r{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-V{background:var(--win-bg);border-color:transparent;color:var(--win)}
.res-N{background:var(--draw-bg);border-color:transparent;color:var(--draw-t)}
.res-D,.res-F{background:var(--loss-bg);border-color:transparent;color:var(--loss)}
.res-T{background:var(--rest-bg);border-color:transparent;color:var(--rest)}
.res-live{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.res-futur,.res-avant{color:var(--muted)}
.is-today{box-shadow:0 0 0 2px var(--accent)}
.hgrid-wrap,.tbl-wrap{overflow-x:auto}
table.hgrid{border-collapse:collapse;width:100%;min-width:460px;font-size:13.5px}
.hgrid th,.hgrid td{padding:5px 3px;text-align:center;border-bottom:1px solid var(--line)}
.hgrid th{font-size:12px;color:var(--muted);font-weight:700}
.hgrid th:first-child,.hgrid td:first-child{text-align:left;padding-left:0}
.hgrid tr:last-child td{border-bottom:0}
.hcell{width:28px;height:28px;border-radius:6px;border:0;display:inline-grid;place-items:center;background:var(--surface-2);color:var(--muted);padding:0;box-shadow:inset 0 0 0 1px var(--line)}
.hcell svg{width:13px;height:13px}
.hcell.on{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.hcell.miss{background:var(--loss-bg);color:var(--loss);box-shadow:none}
.hcell.off{background:transparent;box-shadow:none;cursor:default}
.ratio{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface-2);gap:2px}
.ratio i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.bars{display:grid;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13px;align-items:center}
.bar-row .prog{grid-column:1/-1}

/* ---------- mois */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-h{font-size:12px;font-weight:700;color:var(--muted);text-align:center;letter-spacing:.06em}
.cday{aspect-ratio:1/1;max-width:100%;min-width:0;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);padding:5px 6px;display:grid;grid-template-rows:auto 1fr auto;text-align:left;color:var(--ink)}
.cday .n{font-size:12px;font-weight:600;opacity:.8}
.cday .rl{font:800 13px/1 var(--f-d);align-self:center}
.cday .s{font:800 21px/1 var(--f-d);justify-self:end;font-variant-numeric:tabular-nums}
.cday.blank{visibility:hidden}
.cday:disabled{cursor:default}
.cday.res-futur,.cday.res-avant{background:transparent}
@media (max-width:480px){.cal{gap:4px}.cday{padding:3px 4px;border-radius:7px}.cday .s{font-size:15px}.cday .n{font-size:10.5px}.cday .rl{font-size:11px}}
.fin{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.fin{grid-template-columns:minmax(0,1fr)}}
.runway{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:12px}
.runway b{font:800 40px/1 var(--f-d);font-variant-numeric:tabular-nums}
.runway.crit b{color:var(--loss)}.runway.warn b{color:var(--gold)}.runway.good b{color:var(--win)}

/* ---------- saison */
.heat-wrap{overflow-x:auto;padding-bottom:6px}
.heat-inner{display:inline-grid;gap:4px}
.heat-m{display:grid;grid-auto-flow:column;grid-auto-columns:12px;gap:3px;font-size:10.5px;color:var(--muted);height:14px;white-space:nowrap}
.heat{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px}
.hm{width:12px;height:12px;border-radius:3px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);border:0;padding:0}
.hm.V{background:var(--win);box-shadow:none}.hm.N{background:var(--draw-c);box-shadow:none}.hm.D{background:var(--loss);box-shadow:none}.hm.F{background:var(--loss);opacity:.45;box-shadow:none}.hm.T{background:var(--rest);box-shadow:none}.hm.L{background:var(--accent);box-shadow:none}.hm.B{visibility:hidden}
.hm.now{outline:2px solid var(--accent);outline-offset:1px}
.hm.sel{outline:2px solid var(--ink);outline-offset:1px}
.heat-panel{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px;background:var(--surface-2)}
.pyr{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.pyr li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:14px}
.pyr .py-0{padding:6px 0;border-bottom:1px dashed var(--line)}
.pyr .py-1{font-weight:600}
.pyr .py-2{padding-left:18px}
.pyr .py-3{padding-left:36px;font-size:13.5px}
.py-dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted);align-self:center}
.py-dot.ok{background:var(--ok)}.py-dot.risque{background:var(--risk)}.py-dot.atteint{background:var(--win)}.py-dot.manque{background:var(--loss)}
.cup{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;display:grid;gap:6px}
.cup.won{border-color:var(--gold-bar);background:var(--gold-soft)}
.cup-name{font:700 17px/1.1 var(--f-d);text-transform:uppercase;letter-spacing:.03em}
.recap{border:2px solid var(--gold-bar);margin:12px 0;display:grid;gap:10px}
.recap-t{margin:0;font:800 30px/1 var(--f-d);text-transform:uppercase}

/* ---------- carrière et analyses */
.ladder{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.ladder li{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;border-radius:8px;color:var(--muted);font-size:13.5px}
.ladder li b{font:700 16px/1.2 var(--f-d);text-transform:uppercase;letter-spacing:.03em}
.ladder li.reached{color:var(--ink)}
.ladder li.cur{background:var(--gold-soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--gold-bar)}
table.tbl{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px 6px 0;border-bottom:2px solid var(--ink);white-space:nowrap}
.tbl td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl .pts{color:var(--gold);font-weight:700}
.tbl.recs .rv{font:800 18px/1.1 var(--f-d);white-space:nowrap}
.xptab td:last-child{text-align:right;font-weight:700;color:var(--gold);white-space:nowrap;padding-left:12px}
.troph{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tr{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:5px;background:var(--surface-2)}
.tr b{font:700 16px/1.1 var(--f-d);text-transform:uppercase;letter-spacing:.03em}
.tr span{font-size:12.5px;color:var(--muted)}
.tr .tr-v{font-weight:600;color:var(--ink-2)}
.tr.got{border-color:var(--gold-bar);background:var(--gold-soft)}
.tr.got b{color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.stat-c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
.stat-c b{display:block;font:800 26px/1 var(--f-d);font-variant-numeric:tabular-nums}
.stat-c span{font-size:12.5px;color:var(--muted)}
.chart{display:grid;gap:4px}
.chart-plot{position:relative;height:160px;display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:2px;align-items:end;border-bottom:1px solid var(--line-2)}
.thr{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--line-2)}
.thr span{position:absolute;right:0;top:-15px;font-size:10.5px;color:var(--muted);font-style:normal}
.col-b{height:var(--h);border:0;padding:0;border-radius:3px 3px 0 0;background:var(--line-2);min-width:0}
.col-b.win{background:var(--win)}.col-b.draw{background:var(--draw-c)}.col-b.loss{background:var(--loss)}.col-b.rest{background:var(--rest)}.col-b.live{background:var(--accent)}
.chart-x{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.hbars{display:grid;gap:6px}
.hbar{display:grid;grid-template-columns:minmax(70px,120px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:12px;border-radius:0 4px 4px 0;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.hb-t i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.hbar.ign .hb-v{color:var(--risk);font-weight:600}
.hb-v{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.hb-note{font-size:12px;color:var(--muted);margin:-2px 0 4px}

/* ---------- quêtes */
.filters{display:grid;gap:10px;margin-bottom:14px}
.qrow{display:block!important}
.qline{display:flex;align-items:center;gap:12px;min-width:0}
.acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.postpone{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0 2px 38px}
.postpone input{width:auto}
.group-h{display:flex;align-items:baseline;gap:8px;margin:16px 0 2px}
.group-h:first-child{margin-top:0}
.group-h h3{margin:0;font:700 16px/1.2 var(--f-d);text-transform:uppercase;letter-spacing:.05em}
.group-h.late h3{color:var(--loss)}
@media (max-width:640px){.qline{flex-wrap:wrap}.qline .acts{width:100%;justify-content:flex-start;padding-left:38px}.postpone{margin-left:0}}

/* ---------- compo */
.pitch{border-radius:14px;padding:16px;background:repeating-linear-gradient(90deg,var(--accent-soft) 0 56px,var(--surface-2) 56px 112px);border:1px solid var(--line);display:grid;gap:12px}
.pitch-l{font-size:12px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--accent)}
.pline{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.pline{grid-template-columns:minmax(0,1fr)}}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.pcard.cap{border:2px solid var(--gold-bar)}
.pcard.stag{box-shadow:inset 3px 0 0 var(--risk)}
.pcard-h{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.pcard-h b{font:700 20px/1.1 var(--f-d);text-transform:uppercase;letter-spacing:.03em;flex:1 1 120px;min-width:0;overflow-wrap:anywhere}
.pcard select{width:auto;max-width:200px}
.why{color:var(--ink-2)}
.pstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;margin:0;font-size:13px}
.pstats dt{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.pstats dd{margin:0;font-weight:600}
.pempty{border:1.5px dashed var(--line-2);border-radius:12px;padding:16px;color:var(--muted);text-align:center;font-size:13.5px}
.rules{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}

/* ---------- savoir, réseau */
.lib{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:919px){.lib{grid-template-columns:minmax(0,1fr)}}
.lib-col{display:grid;gap:8px;min-width:0}
.lib-col>h3{margin:0 0 2px;font:700 16px/1.2 var(--f-d);text-transform:uppercase;letter-spacing:.05em;display:flex;gap:8px;align-items:baseline}
.litem{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px;background:var(--surface);min-width:0}
.quote{border-left:3px solid var(--gold-bar);padding-left:10px;font-size:14px;overflow-wrap:anywhere}
.crow{display:block!important}
.cstatus{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.cstatus.late{color:var(--loss)}.cstatus.ok{color:var(--win)}

/* ---------- réglages */
.set-layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:var(--gap);align-items:start}
.set-nav{display:grid;gap:2px;position:sticky;top:120px}
.set-nav button{text-align:left;border:0;background:transparent;padding:8px 12px;border-radius:8px;font-weight:600;color:var(--muted)}
.set-nav button.on{background:var(--ink);color:var(--bg)}
.set-body{display:grid;gap:var(--gap);min-width:0}
@media (max-width:919px){.set-layout{grid-template-columns:minmax(0,1fr)}.set-nav{position:static;display:flex;overflow-x:auto;scrollbar-width:none}.set-nav button{flex:none}}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px}
.sfield{display:grid;gap:2px;align-content:start}
.chk-field{margin-top:10px}
.def{font-size:12px;color:var(--muted)}
.hedit{display:grid;grid-template-columns:minmax(0,1fr) 110px 90px 150px auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hedit .days7{grid-column:1/-1}
@media (max-width:720px){.hedit{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.hedit>input{grid-column:1/-1}}
.days7{display:inline-flex;gap:3px;flex-wrap:wrap}
.days7 button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);font-size:12.5px;font-weight:700;padding:0}
.days7 button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.danger-zone{border-color:var(--loss)}

/* ---------- surcouches */
#ovl{position:fixed;inset:0;z-index:80}
.ovl-back{position:absolute;inset:0;background:rgba(10,8,15,.55)}
.sheet{position:absolute;left:50%;top:10vh;transform:translateX(-50%);width:min(560px,calc(100% - 32px));max-height:80vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
@media (max-width:719px){.sheet{top:auto;bottom:0;transform:translateX(-50%);width:100%;border-radius:16px 16px 0 0;max-height:88vh;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-h h2{margin:0;font:800 22px/1 var(--f-d);text-transform:uppercase;letter-spacing:.03em}
.more-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.more-b{border:1px solid var(--line-2);background:var(--surface-2);border-radius:10px;padding:14px;font-weight:700;text-align:left;display:flex;justify-content:space-between;align-items:center;min-height:52px;color:var(--ink)}
.srch{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.srch button{width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:8px;padding:8px 10px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;color:var(--ink)}
.srch button:hover,.srch button:focus-visible{background:var(--surface-2);border-color:var(--line)}
.srch .st{grid-row:span 2;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);align-self:center;min-width:64px}
.srch .sl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srch .ss{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.ovl-open{overflow:hidden}
#toasts{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:grid;gap:8px;z-index:100;pointer-events:none;width:min(420px,calc(100% - 32px))}
@media (max-width:719px){#toasts{bottom:calc(132px + env(safe-area-inset-bottom,0px))}}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tin .22s ease}
.toast.xp{background:var(--gold-bar);color:var(--on-gold,#1B1726)}
.toast.big{font:800 18px/1.2 var(--f-d);text-transform:uppercase;letter-spacing:.03em;animation:tin .22s ease,glow 1.2s ease}
.toast.bad{background:var(--loss);color:#fff}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(217,162,27,.7)}100%{box-shadow:0 0 0 14px rgba(217,162,27,0)}}
#tip{position:fixed;z-index:120;max-width:260px;background:var(--ink);color:var(--bg);font-size:12.5px;padding:6px 9px;border-radius:7px;pointer-events:none}
.onboard{display:grid;gap:4px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
body.motion-reduce *,body.motion-reduce *::before,body.motion-reduce *::after{animation:none!important;transition:none!important}

/* ---------- apparence personnalisable */
body.titles-classic{--f-d:var(--f-b)}
body.titles-classic .viewhead h1,body.titles-classic .match-title{letter-spacing:0}
body.res-cb .fdot.win{background:#1F77C9}
body.res-cb .fdot.draw{background:#8E8E98;color:#FFFFFF}
body.res-cb .fdot.loss{background:#D55E00}
.pal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.pal{display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px 11px;font-weight:600;font-size:14px;color:var(--ink);text-align:left;min-height:44px}
.pal.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.pal-sw{display:inline-flex;flex:none;border-radius:6px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(127,127,127,.35)}
.pal-sw i{width:12px;height:22px;display:block}
input[type=color]{width:100%;min-width:0;height:40px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:3px;cursor:pointer}
.lang-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.lang-grid .more-b.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}

/* ---------- moodboard */
.mood-grid{columns:2 220px;column-gap:12px}
.tile{break-inside:avoid;margin:0 0 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;display:grid}
.tile.pinned{border-color:var(--gold-bar);box-shadow:inset 0 0 0 1px var(--gold-bar)}
.mimg{display:block;width:100%;height:auto;max-height:420px;object-fit:cover;background:var(--surface-2)}
.mimg.sm{max-height:200px;border-radius:10px}
.mq{margin:0;padding:16px 16px 10px;font:600 17px/1.4 var(--f-b);color:var(--ink);border-left:3px solid var(--gold-bar);overflow-wrap:anywhere}
.mq cite{display:block;margin-top:8px;font:500 13px var(--f-b);color:var(--muted);font-style:normal}
.mq cite::before{content:"— "}
.msw{min-height:110px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding:12px 14px}
.msw.sm{min-height:80px;border-radius:10px}
.msw b{font:700 16px/1.2 var(--f-b)}
.msw span{font:600 12px/1 var(--f-b);letter-spacing:.06em;opacity:.85}
.mn{margin:0;padding:14px 16px;font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.ml{display:grid;gap:3px;padding:14px 16px;text-decoration:none;color:var(--ink)}
.ml b{color:var(--accent);overflow-wrap:anywhere}
.ml span{font-size:12.5px;color:var(--muted)}
.mt{padding:8px 14px 0;font-weight:600;font-size:14px;overflow-wrap:anywhere}
.tile-f{display:grid;gap:4px;padding:8px 10px 10px}
.tile-f .acts{justify-content:flex-start;align-items:center}
.tile-m{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.tile .iconbtn.sm svg{width:14px;height:14px}
.tile .pin{font-size:16px;line-height:1;color:var(--muted)}
.tile .pin.on{color:var(--gold-bar)}
.mform{padding:4px 12px 8px}
.mood-rem{display:grid;gap:8px}
.mood-rem .mt{padding:0}

/* ---------- chrono focus */
.focus-run{display:grid;gap:10px}
.focus-clock{font:800 64px/.9 var(--f-d);font-variant-numeric:tabular-nums;color:var(--accent);letter-spacing:.02em}

/* ---------- récompenses */
.rw.ready .title{color:var(--gold)}
.rw .acts{align-items:center}

/* ---------- premiers pas */
.start{border-color:var(--accent);margin-top:12px}
.start-l{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.start-l li{display:flex;align-items:center;gap:10px;font-size:14px;min-height:30px}
.start-l li.ok{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-2)}
.st-i{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--line-2);display:grid;place-items:center;color:var(--accent-ink)}
.st-i svg{width:12px;height:12px}
.start-l li.ok .st-i{background:var(--accent);border-color:var(--accent)}

/* ---------- guide */
.guide-toc{margin:4px 0 14px}
.guide{display:grid;gap:var(--gap);grid-template-columns:repeat(auto-fill,minmax(320px,1fr));align-items:start}
@media (max-width:719px){.guide{grid-template-columns:minmax(0,1fr)}}
.guide .card h2{margin:0 0 10px;font:700 18px/1.15 var(--f-d);text-transform:uppercase;letter-spacing:.04em}
.guide-b{display:grid;gap:8px;font-size:14.5px}
.guide-b ol.rules{padding-left:20px}

/* ---------- découper une quête, plan de demain */
.split{display:grid;gap:8px;margin:10px 0 2px 38px;padding:10px 12px;border:1px dashed var(--line-2);border-radius:10px;background:var(--surface-2)}
@media (max-width:640px){.split{margin-left:0}}
.tomorrow{border-color:var(--accent)}
.tomorrow .slot-n{font-size:18px;width:14px}

/* ---------- choix de l'univers */
.th-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-top:10px}
.th-card{display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;min-height:60px;color:var(--ink)}
.th-card.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.th-ic{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
.th-ic svg{width:19px;height:19px}
.th-txt{display:grid;gap:2px;min-width:0;flex:1}
.th-txt b{font:700 15px/1.2 var(--f-b)}
.th-txt span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th-pick{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;background:var(--surface-2)}

/* ---------- agent de revue */
.ag-list{display:grid;gap:10px}
.ag-h{margin-top:4px}
.ag-h:first-child{margin-top:0}
.ag-item{border:1px solid var(--line);border-left:3px solid var(--line-2);border-radius:10px;padding:10px 12px;display:grid;gap:7px;background:var(--surface-2)}
.ag-item.sev-critique{border-left-color:var(--loss)}
.ag-item.sev-corriger{border-left-color:var(--risk)}
.ag-item.sev-surveiller{border-left-color:var(--line-2)}
.ag-t{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ag-t b{font:700 15.5px/1.25 var(--f-b);overflow-wrap:anywhere}
.ag-item p{margin:0;color:var(--ink-2)}
.facts.good li::marker{color:var(--win)}
.ag-mini{display:grid;gap:8px}
.ag-mini .card-h h2{display:flex;align-items:center;gap:7px}
.ag-mini .card-h svg{width:15px;height:15px;color:var(--accent)}
.ag-line{display:flex;gap:8px;align-items:center;font-size:14px;padding:7px 9px;border-radius:8px;background:var(--surface-2);border-left:3px solid var(--line-2)}
.ag-line.sev-critique{border-left-color:var(--loss)}
.ag-line.sev-corriger{border-left-color:var(--risk)}
.ag-run{display:grid;gap:10px}
.st-i.ok{background:var(--win);border-color:var(--win);color:#fff}

/* ---------- bibliothèque : fiche dépliée et notes */
.litem.is-open{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.lib-prog{align-items:flex-end}
.lib-panel{display:grid;gap:10px;margin-top:4px;padding-top:10px;border-top:1px solid var(--line)}
.note-form{gap:8px;padding:10px 12px;border:1px dashed var(--line-2);border-radius:10px;background:var(--surface-2)}
.notes{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.note{border:1px solid var(--line);border-radius:10px;padding:9px 11px;display:grid;gap:6px;background:var(--surface)}
.note .n-head{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.note .n-text{font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.note .quote{margin:0}
.note.n-action{border-left:3px solid var(--win)}
.note.n-question{border-left:3px solid var(--ok)}
.note.n-desaccord{border-left:3px solid var(--loss)}
.note .iconbtn.on{color:var(--gold-bar)}
.note .iconbtn:not(.on) svg{opacity:.35}
.stars{display:flex;align-items:center;gap:3px}
.star{background:none;border:0;padding:2px;color:var(--line-2);cursor:pointer;line-height:0}
.star svg{width:15px;height:15px}
.star.on{color:var(--gold-bar)}
.stars .small{margin-left:6px}
.lib-sheet{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.lib-sheet .meta{margin:-4px 0 10px}
.lib-sheet .quote{margin-bottom:8px}
.lib-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:919px){.lib-two{grid-template-columns:minmax(0,1fr)}}
.lib-notes{display:grid;gap:8px;min-width:0}
.lib-notes .notes{max-height:520px;overflow:auto}

ass=\"qline\"><div class=\"grow1\"><div class=\"title\">{1}</div>\n      <div class=\"meta\"><span class=\"chip\">{2}</span>{3}{4}<span class=\"due\">{5} · tous les {6} j</span>{7}</div>\n      {8}</div>\n      <div class=\"acts\">{9}{10}<button type=\"button\" class=\"btn btn-xs btn-ghost\" data-a=\"netOpen\" data-id=\"{11}\">{12}</button>{13}</div></div>\n    {14}\n    {15}\n  </li>","Le principe","<p>Chaque jour est une séance notée sur 100. Tu choisis 3 leviers (des quêtes concrètes), tu fais ta routine, puis tu clôtures la séance le soir.</p>\n      <ul class=\"rules\"><li>{0} ou plus : victoire. De {1} à {2} : nul. En dessous : défaite.</li><li>Une journée sans aucune saisie est perdue par forfait.</li><li>La saison dure plusieurs mois ; la carrière, elle, ne s’arrête jamais.</li></ul>","Une journée type","<ol class=\"rules\"><li><b>Le matin :</b> choisis tes 3 leviers du jour sur l’écran Séance, puis ouvre la séance pour figer ton plan.</li><li><b>Dans la journée :</b> actionne tes leviers, coche ta routine, lance un bloc de focus quand tu dois te concentrer.</li><li><b>Le soir :</b> clôture. Ce qui a été livré, le blocage principal, l’ajustement pour demain. Moins de deux minutes.</li><li><b>Le lendemain :</b> la séance de la veille est figée automatiquement, avec les règles en vigueur ce jour-là.</li></ol>","Score, points, XP et niveau","<ul class=\"rules\"><li><b>Score (sur 100) :</b> l’exécution de la journée. Leviers {0} points, routine {1}, clôture {2}.</li><li><b>Points :</b> la régularité. Victoire 3, nul 1, défaite et forfait 0. Ils font ta forme et ta division.</li><li><b>XP :</b> ce que tu as accompli (quêtes, habitudes, objectifs, bilans, savoir, réseau, focus). Elle ne se perd jamais.</li><li><b>Niveau :</b> calculé sur l’XP de carrière. Chaque palier porte un titre, de Porteur d’idée à Légende de l’entrepreneuriat.</li></ul>","Les types de journée","<ul class=\"rules\"><li><b>Normal</b> ou <b>haute intensité :</b> 3 leviers requis.</li><li><b>Récupération</b> ou <b>voyage :</b> 1 levier requis.</li><li><b>Imprévu :</b> 1 levier, à déclarer avec une raison, y compris après coup.</li><li><b>Jour off :</b> repos planifié. La séance ne compte pas et la série continue. Le nombre de jours off par semaine se règle dans la saison.</li></ul>","Le portefeuille","<p>Trois projets en jeu au maximum : un projet phare (XP × {0}) et deux projets actifs (× {1}). Les projets en veille (× {2}) attendent leur tour ; ceux au frigo (× {3}) sont en pause.</p>\n      <ul class=\"rules\"><li>Tout changement est un arbitrage : par défaut, il prend effet à la prochaine séance.</li><li>Un projet en jeu sans action Marché ou Livrer depuis 7 jours est signalé comme stagnant.</li><li>Les domaines de vie (corps, esprit, argent, relations) restent toujours à × 1.</li></ul>","Les quêtes","<p>Une quête est binaire : faite ou pas. Son type dit sa nature, sa priorité son importance.</p>\n      <ul class=\"rules\"><li><b>Livrer</b> ({0} XP) : ce qui sort de ta tête vers le monde.</li><li><b>Marché</b> ({1} XP) : un contact réel avec un client, un prospect, un investisseur.</li><li><b>Fond</b> ({2} XP) : préparer, étudier, organiser.</li><li>Reportée {3} fois, une quête est signalée comme bloquée : découpe-la ou redéfinis-la.</li><li>Anti-farming : {4} quêtes rapportent de l’XP par jour, dont {5} non planifiées.</li></ul>","Les objectifs","<p>Vision (sur plusieurs saisons) › cap des 90 jours › objectifs de saison › du mois › de la semaine › quêtes.</p>\n      <ul class=\"rules\"><li>Au maximum {0} objectifs par saison, {1} par mois et {2} par semaine. Au-delà, c’est de la dispersion.</li><li>Un objectif non atteint peut être reconduit sur la période suivante.</li><li>Relie tes quêtes à un objectif pour voir ce qui avance vraiment.</li></ul>","Bilans et rapport du board","<ul class=\"rules\"><li>Bilan de la semaine (+{0} XP), du mois (+{1} XP) et de la saison (+{2} XP). Le bilan de la semaine demande une preuve marché et le chiffre encaissé.</li><li>Le rapport du board calcule les chiffres de la période.</li><li>L’interprétation par Claude ne s’appuie que sur ces chiffres et sur le contexte que tu écris dans Réglages › Avancé.</li></ul>","Divisions, trophées et récompenses","<ul class=\"rules\"><li><b>Division :</b> de Pré-amorçage à Licorne, elle dépend uniquement de tes 30 dernières séances (pourcentage des points pris).</li><li><b>Trophées :</b> rares, attribués automatiquement.</li><li><b>Records :</b> ils se battent tout seuls, sur l’écran Carrière.</li><li><b>Récompenses :</b> les tiennes. Choisis quelque chose de réel et une condition (niveau, victoires, série, heures de focus…). Elle se débloque toute seule ; tu l’encaisses quand tu veux.</li></ul>","L’agent de revue","<p>L’agent passe une série de détecteurs sur tes données à chaque ouverture de sa section : exécution quotidienne, projets, quêtes, objectifs, bilans, bibliothèque, réseau. Chaque détecteur a un seuil chiffré et ne dit rien en dessous.</p>\n      <ul class=\"rules\"><li>Trois gravités : <b>urgent</b>, <b>à corriger</b>, <b>à surveiller</b>. Chaque constat cite les chiffres qui l’ont déclenché.</li><li>Un constat peut devenir une quête en un clic, ou être mis de côté pour {0} jours.</li><li><b>Figer la revue</b> garde une photo de l’état du jour ; la fois suivante, l’agent sait ce qui a été réglé et ce qui traîne.</li><li>L’onglet <b>Suivi</b> montre ce que l’agent a recommandé et ce que tu en as fait.</li><li>La lecture par Claude ne reçoit que les chiffres et les constats.</li></ul>","La bibliothèque","<p>Tout ce que tu lis ou écoutes — livres, articles, cours, études de cas, podcasts — et les notes qui vont avec.</p>\n      <ul class=\"rules\"><li>Trois colonnes : à lire, en cours, terminé. La progression se suit en pourcentage ou en pages.</li><li>Une note est toujours rattachée à une lecture, avec son type (<b>idée</b>, <b>citation</b>, <b>question</b>, <b>action</b>, <b>désaccord</b>) et sa page. L’onglet <b>Notes</b> les rassemble toutes, avec recherche et épinglage.</li><li>Une note « action » se transforme en quête Marché : c’est le seul chemin entre une lecture et une séance.</li><li>Les notes ne rapportent aucune XP. Terminer avec l’idée clé en donne {0}, l’appliquer {1} de plus.</li></ul>","Réseau et Moodboard","<ul class=\"rules\"><li><b>Réseau :</b> clients, prospects, investisseurs, mentors. Chaque contact a une cadence de relance ; les retards remontent sur l’écran Séance.</li><li><b>Moodboard :</b> images, citations, couleurs, notes et liens. Épingle un élément (★) pour le revoir chaque jour sur l’écran Séance.</li></ul>","Le chrono focus","<ul class=\"rules\"><li>Blocs de 25, 50 ou 90 minutes, liés ou non à une quête.</li><li>Un bloc terminé rapporte {0} XP, dans la limite de {1} blocs par jour. Il ne change pas le score de la séance.</li><li>Le temps restant s’affiche dans l’onglet du navigateur ; un signal sonore marque la fin (désactivable dans Réglages › Séance).</li></ul>","Réglages, langue et couleurs","<ul class=\"rules\"><li>Tout se règle : barème, XP, types de journée, fenêtre d’arbitrage, nombre d’objectifs.</li><li>Chaque séance garde les règles avec lesquelles elle a été jouée : changer un réglage ne réécrit jamais le passé.</li><li><b>Langue :</b> français, anglais ou espagnol, à tout moment. Tes propres textes ne sont pas traduits.</li><li><b>Apparence :</b> thème clair ou sombre, palettes de couleurs ou couleurs libres, couleurs de résultats adaptées au daltonisme.</li></ul>","Tes données","<ul class=\"rules\"><li>Ouvert dans Claude : tes données vivent dans la base privée de la page, avec une sauvegarde automatique chaque semaine.</li><li>En fichier autonome : elles restent dans ce navigateur. Exporte-les régulièrement en JSON (Réglages › Données).</li><li>Un import remplace toutes les données, après confirmation.</li><li><b>Nouveau départ</b> (Réglages › Données) recale la saison sur une date propre et efface les journées de rodage qui la précèdent. Projets, portefeuille, routine, quêtes, bibliothèque et réseau sont conservés.</li></ul>","Raccourcis clavier","<ul class=\"rules\"><li><b>/</b> rechercher</li><li><b>Q</b> nouvelle quête</li><li><b>N</b> note rapide</li><li><b>M</b> séance du jour</li><li><b>Échap</b> fermer une fenêtre</li></ul>","\n  <div class=\"viewhead\"><div class=\"grow\"><div class=\"eyebrow\">Mode d’emploi</div><h1>Guide</h1></div><button type=\"button\" class=\"btn btn-sm\" data-a=\"go\" data-tab=\"match\" data-today=\"1\">Retour au jeu</button></div>\n  <div class=\"chips guide-toc\">{0}</div>\n  <div class=\"guide\">{1}</div>","Score","Routines","Objectifs","Agent de revue","Notifications","Langue","Apparence","Données","Avancé","<div class=\"sfield\"><label class=\"lbl\" for=\"{0}\">{1}</label><input type=\"number\" id=\"{2}\" data-c=\"set\" data-path=\"{3}\" data-type=\"num\" min=\"{4}\" max=\"{5}\" step=\"{6}\" value=\"{7}\"><span class=\"def\">défaut {8}{9}</span></div>","oui","non","<div class=\"sfield chk-field\"><label class=\"switch\"><input type=\"checkbox\" id=\"{0}\" data-c=\"set\" data-path=\"{1}\" data-type=\"bool\" {2}><span>{3}</span></label><span class=\"def\">défaut {4}</span></div>","<div class=\"sfield\"><label class=\"lbl\" for=\"{0}\">{1}</label><select id=\"{2}\" data-c=\"set\" data-path=\"{3}\" data-type=\"str\">{4}</select><span class=\"def\">défaut {5}</span></div>","<button type=\"button\" class=\"btn btn-sm btn-ghost\" data-a=\"setRestore\" data-sec=\"{0}\">Restaurer les valeurs par défaut</button>","\n  <div class=\"viewhead\"><div class=\"grow\"><div class=\"eyebrow\">Règles, routine, données</div><h1>Réglages</h1></div></div>\n  <div class=\"set-layout\">\n    <nav class=\"set-nav\" aria-label=\"Sections des réglages\">{0}</nav>\n    <div class=\"set-body\">{1}</div>\n  </div>","Saison en cours : {0}","Créer une saison","Étapes du cap des 90 jours","Fait","<li><div class=\"grow1\"><div class=\"title n\">{0}</div><div class=\"meta\">{1}{2}</div></div><button type=\"button\" class=\"btn btn-xs btn-ghost\" data-a=\"capStepDel\" data-s=\"{3}\" data-id=\"{4}\">Retirer</button></li>","<p class=\"small muted\">Aucune étape : le statut du cap ne peut pas être estimé.</p>","{0}\n    <form class=\"formbox\" data-f=\"capStepAdd\" data-s=\"{1}\"><div class=\"form-row\"><div class=\"grow\"><label class=\"lbl\" for=\"cms-t\">Nouvelle étape</label><input type=\"text\" id=\"cms-t\" class=\"draft\" name=\"title\" maxlength=\"120\"></div><div class=\"fix\"><label class=\"lbl\" for=\"cms-d\">Échéance</label><input type=\"date\" id=\"cms-d\" class=\"draft\" name=\"due\"></div><button type=\"submit\" class=\"btn\">Ajouter</button></div></form>","+{0} XP par étape","Toutes les saisons","Terminée","<li><div class=\"grow1\"><div class=\"title\">{0}</div><div class=\"meta\"><span class=\"due\">{1} → {2}</span>{3}</div></div><button type=\"button\" class=\"btn btn-xs btn-ghost\" data-a=\"seasonView\" data-id=\"{4}\">Voir</button></li>","<ul class=\"rows\">{0}</ul>\n    <div class=\"hr\"></div><div class=\"eyebrow\">Préparer la saison suivante</div><p class=\"small muted\" style=\"margin:4px 0 10px\">L'XP de carrière, les trophées et les records sont conservés ; l'XP de saison repart de zéro.</p>{1}","Score de la séance","Poids des 3 leviers","Poids de la routine","Poids de la clôture","Seuil de victoire","Seuil du nul","Arrondi","Au plus proche","Vers le bas","<tr><td>{0}</td><td><label class=\"sr\" for=\"dtc-{1}\">Leviers requis</label><input type=\"number\" id=\"dtc-{2}\" data-c=\"set\" data-path=\"dayTypes.{3}.coups\" data-type=\"num\" min=\"0\" max=\"3\" step=\"1\" value=\"{4}\" class=\"w70\"></td><td><label class=\"switch\"><input type=\"checkbox\" id=\"dtr-{5}\" data-c=\"set\" data-path=\"dayTypes.{6}.routine\" data-type=\"bool\" {7}><span class=\"sr\">Routine comptée</span></label></td></tr>","<p class=\"small\">Le score mesure l'exécution de la journée, sur 100. Il est distinct de l'XP (ce qui est accompli), des points (la régularité) et du niveau (l'expérience).</p>\n  <div class=\"sgrid\">{0}{1}{2}</div>\n  <div class=\"sgrid\">{3}{4}{5}</div>\n  <div class=\"eyebrow\" style=\"margin-top:12px\">Poids des leviers selon leur type</div>\n  <div class=\"sgrid\">{6}{7}{8}</div>\n  <div class=\"eyebrow\" style=\"margin-top:12px\">Types de séance</div>\n  <div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th>Type</th><th>Leviers requis</th><th>Routine comptée</th></tr></thead><tbody>{9}<tr><td>Jour off</td><td colspan=\"2\" class=\"muted small\">Neutre, quota par semaine réglé dans la saison</td></tr></tbody></table></div>\n  <p class=\"small muted\" style=\"margin-top:10px\">Version des règles : v{10}. Chaque séance terminée garde les règles avec lesquelles elle a été jouée : un changement ici ne modifie jamais un score passé.</p>\n  <div class=\"row-wrap\" style=\"margin-top:8px\">{11}</div>","Quête Livrer","Quête Marché","Quête Fond","Multiplicateur projet phare","Multiplicateur projet actif","Multiplicateur projet en veille","Multiplicateur projet au frigo","Objectif semaine","Objectif mois","Objectif saison","Bilan semaine","Bilan mois","Bilan saison","Savoir terminé (idée clé)","Échange réseau","Étape de challenge","Bloc de focus terminé","Blocs de focus avec XP par jour","Quêtes rapportant de l’XP par jour","au-delà : 0 XP","Dont non planifiées","créées et faites le jour même","<p class=\"small\">L'XP mesure ce qui est accompli. Elle ne se perd jamais : seule une saisie annulée retire son propre gain.</p>\n  <div class=\"sgrid\">{0}{1}{2}</div>\n  <div class=\"sgrid\">{3}{4}{5}{6}</div>\n  <div class=\"sgrid\">{7}{8}{9}{10}{11}</div>\n  <div class=\"sgrid\">{12}{13}{14}{15}{16}{17}</div>\n  <div class=\"sgrid\">{18}{19}{20}{21}{22}</div>\n  <div class=\"eyebrow\" style=\"margin-top:12px\">Anti-farming</div>\n  <div class=\"sgrid\">{23}{24}</div>\n  <p class=\"small muted\">L'XP des habitudes se règle dans Routines. Un changement ici ne modifie pas l'XP déjà gagnée.</p>\n  <div class=\"row-wrap\" style=\"margin-top:8px\">{25}</div>","Type de séance par défaut","Proposer l’ouverture chaque matin","Signal sonore à la fin d’un bloc de focus","Type par défaut","Priorité par défaut","Signaler comme bloquée après","Portefeuille et arbitrages","Fenêtre d’arbitrage","<div class=\"sgrid\">{0}</div><p class=\"small muted\">Par défaut, un changement de statut prend effet à la prochaine séance. Le multiplicateur appliqué à une quête reste celui du jour où elle est terminée.</p><div class=\"row-wrap\" style=\"margin-top:8px\">{1}</div>","Maximum par semaine","recommandé 3","Maximum par mois","Maximum par saison","recommandé 5","<div class=\"sgrid\">{0}{1}{2}</div><p class=\"small muted\">La limite protège contre la dispersion. Monter au-delà des valeurs recommandées affaiblit le système.</p><div class=\"row-wrap\" style=\"margin-top:8px\">{3}</div>","Figer une revue automatiquement chaque semaine","Afficher les constats importants sur l’écran de la séance","Durée de mise de côté d’un constat","Séances minimum avant analyse","sous ce seuil, l’agent se tait","Dernière revue figée le {0}.","Aucune revue figée pour l’instant.","revue gardée","revues gardées","<li><div class=\"grow1 small\">{0}</div><span class=\"due\">jusqu’au {1}</span><button type=\"button\" class=\"btn btn-xs btn-ghost\" data-a=\"agWake\" data-key=\"{2}\">Remettre</button></li>","<div class=\"hr\"></div><div class=\"eyebrow\">Constats mis de côté</div><ul class=\"rows\">{0}</ul>","<p class=\"small\">L'agent passe {0} détecteurs sur tes données à chaque ouverture de sa section. Il ne lit que ce qui est enregistré : aucun chiffre n'est inventé, aucune donnée ne sort de ta base sans que tu demandes une lecture à Claude.</p>\n    {1}\n    {2}\n    <div class=\"sgrid\">{3}{4}</div>\n    <p class=\"small muted\">{5} {6} (30 au maximum, les plus anciennes sont effacées).</p>\n    {7}\n    <div class=\"row-wrap\" style=\"margin-top:8px\">{8}</div>","Objectif de ressources terminées par an","0 pour ne rien afficher","Ressource terminée avec l’idée clé","Idée appliquée dans la vraie vie","<p class=\"small\">Les lectures et leurs notes vivent dans la même fiche : une note est toujours rattachée à ce que tu lisais.</p>\n  <div class=\"sgrid\">{0}</div>\n  <div class=\"sgrid\">{1}{2}</div>\n  <p class=\"small muted\">Les notes ne rapportent volontairement aucune XP : elles servent à retrouver ce que tu as lu, pas à marquer des points. C'est l'application d'une idée qui en donne.</p>\n  <div class=\"row-wrap\" style=\"margin-top:8px\">{3}</div>","Ouverture le matin (plan du jour, échéances)","Rappel des échéances du jour (dans le message du matin)","Clôture le soir (bilan de la séance)","<p class=\"small\">Les notifications passent par des tâches programmées de Claude, qui lisent ces réglages avant d'envoyer quoi que ce soit. Désactivé ici = silence.</p>\n  {0}<div class=\"sgrid\"><div class=\"sfield\"><label class=\"lbl\" for=\"set-notif-kickoffTime\">Heure du matin</label><input type=\"time\" id=\"set-notif-kickoffTime\" data-c=\"set\" data-path=\"notif.kickoffTime\" data-type=\"str\" value=\"{1}\"><span class=\"def\">défaut 08:00</span></div></div>\n  {2}\n  {3}<div class=\"sgrid\"><div class=\"sfield\"><label class=\"lbl\" for=\"set-notif-fulltimeTime\">Heure du soir</label><input type=\"time\" id=\"set-notif-fulltimeTime\" data-c=\"set\" data-path=\"notif.fulltimeTime\" data-type=\"str\" value=\"{4}\"><span class=\"def\">défaut 21:30</span></div></div>\n  <p class=\"small muted\">Les heures d'envoi réelles sont celles des tâches programmées ; pour les décaler, demande-le à Claude.</p>\n  <div class=\"row-wrap\" style=\"margin-top:8px\">{5}</div>","Automatique · {0}","<div class=\"lang-grid\">{0}</div>\n    <p class=\"small muted\" style=\"margin-top:10px\">Toute l’interface change immédiatement : textes, dates, nombres et analyses de Claude. Tes propres textes (quêtes, notes, projets) restent tels que tu les as écrits.</p>","Thème","Automatique (celui de Claude)","Sombre","Cla
